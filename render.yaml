# Render Blueprint — FREE deploy of SiteLedger (no paid disk, no payment required).
#
# In Render: New + > Blueprint > pick this repo > Apply. It deploys on the Free plan.
# Optional: set ANTHROPIC_API_KEY in the dashboard (Environment tab) to turn on the
# plain-English assistant. The dashboard + manual entry work without it.
#
# DATA NOTE: the Free plan has no persistent disk and the service sleeps after ~15
# minutes of inactivity, so the local database resets when it wakes. That's fine for
# trying it out — but for a real months-long tracker, either press the in-app data
# export regularly, or ask to switch storage to a FREE hosted database (e.g. Turso)
# so everything is kept permanently at no cost. See README "Put it online".
services:
  - type: web
    name: siteledger
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # optional — set in the Render dashboard to enable the assistant
