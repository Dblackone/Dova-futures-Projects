name: Deploy trackers to GitHub Pages

# Publishes the standalone HTML tools (no server needed) to GitHub Pages.
# Runs on every push to main, and can be triggered manually.
on:
  push:
    branches: [main]
    paths:
      - "pool-tracker.html"
      - "schedule-of-work.html"
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # turns Pages on automatically on first run

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp pool-tracker.html _site/pool-tracker.html
          cp schedule-of-work.html _site/schedule-of-work.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
